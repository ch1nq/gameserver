# Checks the Python agent SDK: codegen from protos, lint, format, types, tests.
name: Python SDK

on:
  push:
    paths:
      - 'sdk/python/**'
      - 'protos/achtung_agent.proto'
      - '.github/workflows/sdk-python.yml'
  pull_request:
    paths:
      - 'sdk/python/**'
      - 'protos/achtung_agent.proto'
      - '.github/workflows/sdk-python.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Best practice per uv docs: pin the uv version itself, not just the action.
          version: "0.12.15"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev

      - name: Generate stubs from protos
        run: uv run python scripts/codegen.py

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest
