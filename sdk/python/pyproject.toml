[project]
name = "achtung"
version = "0.1.0"
description = "Python agent SDK for Achtung! Die Kurve matches."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.74,<2",
    "protobuf>=5.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.74,<1.75",
    "mypy-protobuf>=5.1.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7.3",
    "ty",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated protobuf/gRPC stubs are machine output: never lint or format them.
exclude = ["src/achtung/_generated"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# Defaults (E4/E7/E9/F) stay on; extend rather than replace so future
# ruff defaults apply automatically.
extend-select = ["I", "UP", "B", "ASYNC"]

[tool.ty.environment]
python-version = "3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/achtung"]
