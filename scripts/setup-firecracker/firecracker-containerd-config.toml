# Config for the dedicated `firecracker-containerd` daemon.
#
# This is a SEPARATE containerd instance from any system containerd. Only this
# daemon loads the firecracker control (`fccontrol`) plugin that serves the
# CreateVM/StopVM API the coordinator calls. It listens on its own socket so it
# never collides with a system containerd on /run/containerd/containerd.sock.
#
# Installed to /etc/firecracker-containerd/config.toml by install.sh.
version = 2

# CRI is not needed; we drive the daemon directly via ctr + the control API.
disabled_plugins = ["io.containerd.grpc.v1.cri"]

root  = "/var/lib/firecracker-containerd/containerd"
state = "/run/firecracker-containerd"

[grpc]
  # Must match CONTAINERD_SOCKET / FirecrackerMachineProviderConfig.containerd_socket
  address = "/run/firecracker-containerd/containerd.sock"

[plugins]
  # devmapper snapshotter — required: firecracker needs block-device rootfs.
  [plugins."io.containerd.snapshotter.v1.devmapper"]
    pool_name       = "fc-dev-thinpool"
    root_path       = "/var/lib/firecracker-containerd/snapshotter/devmapper"
    base_image_size = "10GB"
    discard_blocks  = true

[debug]
  level = "debug"

# The `aws.firecracker` runtime is a v2 shim discovered by binary name
# (containerd-shim-aws-firecracker on PATH); it needs no [plugins] registration.
# Per-VM kernel/rootfs/machine defaults live in firecracker-runtime.json, located
# via the FIRECRACKER_CONTAINERD_RUNTIME_CONFIG_PATH env var (set in the unit).
