syntax = "proto3";

package spectator;

import "spectator_frame.proto";

// Browser-facing spectator service, exposed by the website over gRPC-Web.
// The website relays frames from the current game host's GameHost.WatchGame
// stream. Keeps the coordinator-only StartGame/GetStatus surface off the
// public browser API.
//
// Reuses the shared spectator_frame.SpectatorFrame the game host produces, so
// the relay forwards frames as-is with no field-by-field copy.
service Spectator {
  rpc Watch(WatchRequest) returns (stream spectator_frame.SpectatorFrame);
}

message WatchRequest {}
